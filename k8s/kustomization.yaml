apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # 1. Namespace first
  - namespace.yaml

  # 2. Config
  - config/common-env-configmap.yaml
  - config/mbta-env-configmap.yaml
  - config/valley-metro-env-configmap.yaml

  # 3. Secrets (generated separately, not committed — see secrets/*.yaml.example)

  # 4. Kafka (zookeeper before kafka)
  - kafka/zookeeper-deployment.yaml
  - kafka/zookeeper-service.yaml
  - kafka/kafka-deployment.yaml
  - kafka/kafka-service.yaml

  # 5. Redis
  - redis/redis-statefulset.yaml
  - redis/redis-service.yaml

  # 6. Spark (master + sidecars, then workers + HPA)
  - spark/spark-master-deployment.yaml
  - spark/spark-master-service.yaml
  - spark/spark-worker-deployment.yaml
  - spark/spark-worker-hpa.yaml

  # 7. Producers
  - producers/producer-mbta-deployment.yaml
  - producers/producer-valley-metro-deployment.yaml

  # 8. Web
  - web/flask-deployment.yaml
  - web/flask-service.yaml
  - web/ingress.yaml

  # 9. CronJobs
  - cronjobs/analysis-job-cronjob.yaml
  - cronjobs/batch-jobs-mbta-cronjob.yaml
  - cronjobs/batch-jobs-valley-metro-cronjob.yaml
