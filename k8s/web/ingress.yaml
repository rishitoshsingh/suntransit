apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-web
  namespace: suntransit
  annotations:
    # k3s ships Traefik; this annotation selects it
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-web
                port:
                  number: 80
