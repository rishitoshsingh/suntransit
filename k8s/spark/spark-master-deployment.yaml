apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: suntransit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      enableServiceLinks: false
      hostname: spark-master
      containers:
        - name: spark-master
          image: suntransit/spark:latest
          imagePullPolicy: Never
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
            - --host
            - spark-master
            - --port
            - "7077"
            - --webui-port
            - "8080"
          env:
            - name: HADOOP_USER_NAME
              value: spark
          ports:
            - name: cluster
              containerPort: 7077
            - name: webui
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

        # Replaces suntransit-mbta-redis.service systemd unit
        - name: push-redis-mbta
          image: suntransit/spark:latest
          imagePullPolicy: Never
          restartPolicy: Always
          command:
            - bash
            - -c
            - |
              echo "[$(date)] Waiting for spark-master on spark-master:7077..."
              until python3 -c "import socket; s=socket.create_connection(('spark-master',7077),1); s.close()" 2>/dev/null; do sleep 2; done
              echo "[$(date)] Starting push_redis.py for MBTA"
              /opt/spark/bin/spark-submit \
                --master spark://spark-master:7077 \
                --conf spark.jars.ivy=/tmp/.ivy2 \
                --conf spark.executor.cores=1 \
                --conf spark.cores.max=1 \
                --conf spark.executor.memory=900m \
                --jars /opt/spark/jars/spark-sql-kafka-0-10_2.12-3.5.2.jar,/opt/spark/jars/kafka-clients-3.5.2.jar,/opt/spark/jars/spark-token-provider-kafka-0-10_2.12-3.5.2.jar,/opt/spark/jars/commons-pool2-2.11.1.jar \
                /app/push_redis.py
          envFrom:
            - configMapRef:
                name: common-env
            - configMapRef:
                name: mbta-env
            - secretRef:
                name: credentials
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"

        # Replaces suntransit-valley-metro-redis.service systemd unit
        - name: push-redis-valley-metro
          image: suntransit/spark:latest
          imagePullPolicy: Never
          restartPolicy: Always
          command:
            - bash
            - -c
            - |
              echo "[$(date)] Waiting for spark-master on spark-master:7077..."
              until python3 -c "import socket; s=socket.create_connection(('spark-master',7077),1); s.close()" 2>/dev/null; do sleep 2; done
              echo "[$(date)] Starting push_redis.py for Valley Metro"
              /opt/spark/bin/spark-submit \
                --master spark://spark-master:7077 \
                --conf spark.jars.ivy=/tmp/.ivy2 \
                --conf spark.executor.cores=1 \
                --conf spark.cores.max=1 \
                --conf spark.executor.memory=900m \
                --jars /opt/spark/jars/spark-sql-kafka-0-10_2.12-3.5.2.jar,/opt/spark/jars/kafka-clients-3.5.2.jar,/opt/spark/jars/spark-token-provider-kafka-0-10_2.12-3.5.2.jar,/opt/spark/jars/commons-pool2-2.11.1.jar \
                /app/push_redis.py
          envFrom:
            - configMapRef:
                name: common-env
            - configMapRef:
                name: valley-metro-env
            - secretRef:
                name: credentials
          env:
            - name: GTFS_URL
              valueFrom:
                secretKeyRef:
                  name: gtfs-keys
                  key: GTFS_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
